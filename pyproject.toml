[project]
name = "ott-agent"
version = "0.1.0"
description = "One viewer, one agent: decide, act, and measure for an OTT dialect platform."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ott-agent = "ott_agent.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
